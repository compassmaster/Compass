name: Run Stage 2 docs sync in PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'docs/stage2-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run synchronization script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/stage2-doc-sync.yml').read_text(encoding='utf-8')
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/stage2-doc-sync.js').write_text(
              textwrap.dedent(source[start:end]),
              encoding='utf-8',
          )
          PY
          node /tmp/stage2-doc-sync.js

      - name: Commit synchronized documents
        shell: bash
        run: |
          rm .github/workflows/stage2-doc-sync.yml
          rm .github/workflows/stage2-doc-sync-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml docs .github/workflows/stage2-doc-sync.yml .github/workflows/stage2-doc-sync-pr.yml
          git commit -m "docs: Stage 2 Conversation Captureの完了状態を同期"
          git push origin HEAD:docs/stage2-completion
